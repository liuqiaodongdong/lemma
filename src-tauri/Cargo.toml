[package]
name = "lemma"
version = "0.1.0"
description = "Lemma — AI-Agent Native LaTeX-Styled WYSIWYG Markdown Editor for Economics"
authors = ["Lemma Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lemma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
sha2 = "0.10"
base64 = "0.22"
